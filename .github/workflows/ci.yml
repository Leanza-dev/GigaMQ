name: Go Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Build Codebase
        run: go build -v ./...

      - name: Run Go Verifications (go vet)
        run: go vet ./...

      - name: Run Test Suite
        run: go test -v -race -coverprofile=coverage.out ./...
